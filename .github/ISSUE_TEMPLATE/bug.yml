name: Bug report
description: Report a reproducible problem without exposing private collection data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach media, collection names, private paths, action logs, cache files, or unreviewed command logs. Replace sensitive values with generic placeholders.
  - type: input
    id: version
    attributes:
      label: pymo version
      description: Paste only the output of `pymo --version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - WSL
        - Other or unsupported
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the behavior using synthetic names and aggregate counts only.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction, with private values replaced.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed media, collection names, private paths, identifying metadata, and unreviewed logs.
          required: true
