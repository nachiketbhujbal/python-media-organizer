name: Feature request
description: Propose a focused improvement to safe local media organization.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Keep examples synthetic. Do not post media, collection names, private paths, identifying metadata, or unreviewed logs.
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What safe workflow or outcome is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the interface and its safety boundaries.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I used only synthetic, non-identifying examples.
          required: true
