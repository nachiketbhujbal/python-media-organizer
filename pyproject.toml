[build-system]
requires = [
    "hatchling>=1.27,<2",
    "hatch-vcs>=0.5,<1",
]
build-backend = "hatchling.build"

[project]
name = "python-media-organizer"
dynamic = ["version"]
description = "Safe, local-first, reversible media collection tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "nachiketbhujbal" },
]
keywords = ["media", "organizer", "duplicates", "privacy", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia",
]
dependencies = [
    "Pillow>=9",
]

[project.scripts]
pymo = "pymo.cli:main"

[project.urls]
Repository = "https://github.com/nachiketbhujbal/python-media-organizer"
Issues = "https://github.com/nachiketbhujbal/python-media-organizer/issues"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/pymo"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.python-version",
    "/AGENTS.md",
    "/HANDOFF.md",
    "/RESEARCH_IMPROVEMENTS.md",
    "/uv.lock",
]

[tool.uv]
required-version = ">=0.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
