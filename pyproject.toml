[build-system]
requires = [
    "hatchling>=1.27,<2",
    "hatch-vcs>=0.5,<1",
]
build-backend = "hatchling.build"

[project]
name = "python-media-organizer"
dynamic = ["version"]
description = "Safe, local-first, reversible media collection tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "nachiketbhujbal" },
]
keywords = ["media", "organizer", "duplicates", "privacy", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia",
]
dependencies = [
    "Pillow>=9",
]

[project.scripts]
pymo = "pymo.cli:main"

[project.urls]
Repository = "https://github.com/nachiketbhujbal/python-media-organizer"
Issues = "https://github.com/nachiketbhujbal/python-media-organizer/issues"

[dependency-groups]
dev = [
    "black>=25.11,<26",
    "mypy>=1.19,<2",
    "pre-commit>=4.3,<5",
    "pytest>=8",
    "pytest-cov>=7,<8",
    "ruff>=0.16.4,<1",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/pymo"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.python-version",
    "/AGENTS.md",
    "/HANDOFF.md",
    "/RESEARCH_IMPROVEMENTS.md",
    "/uv.lock",
]

[tool.uv]
required-version = ">=0.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.coverage.run]
source = ["pymo"]
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/pymo"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
