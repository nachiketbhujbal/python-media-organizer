version = 1

[ignore]
files = [
    ".DS_Store",
    ".DS_Store (*)",
    "._*",
    "Thumbs.db",
    "ehthumbs.db",
    "desktop.ini",
    ".directory",
    ".com.apple.timemachine.donotpresent",
    ".VolumeIcon.icns",
    "Icon\r",
    ".pymo.toml",
    ".pymo.sqlite3",
    ".pymo.sqlite3-wal",
    ".pymo.sqlite3-shm",
    ".pymo.sqlite3-journal",
    ".pymo.sqlite3.lock",
    ".pymo.sqlite3.new.*",
]
directories = [
    ".AppleDouble",
    ".DocumentRevisions-V100",
    ".fseventsd",
    ".Spotlight-V100",
    ".TemporaryItems",
    ".Trashes",
    ".Trash",
    ".Trash-*",
    "$RECYCLE.BIN",
    "@eaDir",
    "__MACOSX",
    ".git",
    ".hg",
    ".svn",
    "System Volume Information",
]

[classification]
image_extensions = [
    ".avif",
    ".bmp",
    ".cr2",
    ".cr3",
    ".dng",
    ".gif",
    ".heic",
    ".heif",
    ".jfif",
    ".jpe",
    ".jpeg",
    ".jpg",
    ".nef",
    ".orf",
    ".png",
    ".raf",
    ".raw",
    ".rw2",
    ".svg",
    ".tif",
    ".tiff",
    ".webp",
]
video_extensions = [
    ".3g2",
    ".3gp",
    ".asf",
    ".avi",
    ".divx",
    ".flv",
    ".m2ts",
    ".m4v",
    ".mkv",
    ".mov",
    ".mp4",
    ".mpe",
    ".mpeg",
    ".mpg",
    ".mts",
    ".ogv",
    ".rm",
    ".rmvb",
    ".ts",
    ".vob",
    ".webm",
    ".wmv",
]
video_application_mime_types = [
    "application/mp4",
    "application/ogg",
    "application/vnd.rn-realmedia",
]
generic_mime_types = [
    "application/octet-stream",
    # An empty stream carries no content signature at all, so the extension is
    # the only available evidence. The utility spells this differently when it
    # reads a pathname than when it reads standard input, and descriptor-pinned
    # callers always use the latter; both spellings must stay listed.
    "inode/x-empty",
    "application/x-empty",
]

# ffprobe reports shared demuxer families for containers it cannot distinguish
# by family name alone. This packaged-only validation policy covers every
# packaged video extension; collection configuration cannot redefine it.
[validation.container_families]
".3g2" = ["mov,mp4,m4a,3gp,3g2,mj2"]
".3gp" = ["mov,mp4,m4a,3gp,3g2,mj2"]
".asf" = ["asf", "asf_o"]
".avi" = ["avi"]
".divx" = ["avi"]
".flv" = ["flv"]
".m2ts" = ["mpegts"]
".m4v" = ["mov,mp4,m4a,3gp,3g2,mj2"]
".mkv" = ["matroska,webm"]
".mov" = ["mov,mp4,m4a,3gp,3g2,mj2"]
".mp4" = ["mov,mp4,m4a,3gp,3g2,mj2"]
".mpe" = ["mpeg", "mpegvideo"]
".mpeg" = ["mpeg", "mpegvideo"]
".mpg" = ["mpeg", "mpegvideo"]
".mts" = ["mpegts"]
".ogv" = ["ogg"]
".rm" = ["rm"]
".rmvb" = ["rm"]
".ts" = ["mpegts"]
".vob" = ["mpeg"]
".webm" = ["matroska,webm"]
".wmv" = ["asf", "asf_o"]

# Extension correction is packaged-only. The first extension is canonical;
# later entries are accepted synonyms that must remain unchanged. Formats and
# shared demuxer families without one defensible canonical suffix are omitted.
[extension_correction]
protected_image_extensions = [
    ".cr2",
    ".cr3",
    ".dng",
    ".heic",
    ".heif",
    ".nef",
    ".orf",
    ".raf",
    ".raw",
    ".rw2",
    ".svg",
    ".tif",
    ".tiff",
]
protected_video_families = [
    "3g2,3gp,m4a,mj2,mov,mp4",
    "asf",
    "asf_o",
    "matroska,webm",
    "mpegvideo",
    "ogg",
    "rm",
]

[extension_correction.image_formats]
AVIF = [".avif"]
BMP = [".bmp"]
GIF = [".gif"]
JPEG = [".jpg", ".jpeg", ".jpe", ".jfif"]
PNG = [".png"]
WEBP = [".webp"]

[extension_correction.video_families]
avi = [".avi", ".divx"]
flv = [".flv"]
mpeg = [".mpeg", ".mpe", ".mpg", ".vob"]
mpegts = [".ts", ".mts", ".m2ts"]

[rename]
noise_tokens = [
    "copy",
    "com",
    "download",
    "full",
    "hd",
    "image",
    "img",
    "jb",
    "join",
    "leak",
    "leaks",
    "min",
    "nsfw",
    "photo",
    "pic",
    "picture",
    "promo",
    "channel",
    "site",
    "source",
    "telegram",
    "tg",
    "tp",
    "thumb",
    "us",
    "vid",
    "video",
]

[image_duplicates]
extensions = [
    ".bmp",
    ".gif",
    ".jpeg",
    ".jpg",
    ".png",
    ".tif",
    ".tiff",
    ".webp",
]

[video_duplicates]
decode_timeout_seconds = 3600

[performance]
scan_workers = 4
progress_interval_seconds = 15
cache_publication_batch_size = 32
